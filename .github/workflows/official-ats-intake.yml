name: Official ATS Durable Source Intake

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/intake_official_ats.py
      - scripts/build_review_dispatch.py
      - tests/test_build_review_dispatch.py
      - scripts/collect_market_api.py
      # Legacy API collector remains for regression parity; not run in production.
      - scripts/enrich_pending_public_ats.py
      - scripts/reconcile_pending_exact_issue.py
      - tests/test_reconcile_pending_exact_issue.py
      - tests/test_enrich_pending_public_ats.py
      - tests/test_collect_market_api.py
      - scripts/platform_index_queue.py
      - tests/test_intake_official_ats.py
      - scripts/report_job_pipeline_health.py
      - tests/test_job_pipeline_health.py
      - .github/workflows/official-ats-intake.yml
  schedule:
    # 38 minutes after upstream public ATS producer UTC :37.
    - cron: '15 2,6,10,14,18,22 * * *'

permissions:
  contents: write
  issues: read

concurrency:
  group: official-ats-intake
  cancel-in-progress: false

jobs:
  persist-source-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run whole Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Download current official employer ATS market feeds
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request,urlopen
          target=Path("artifacts/ats-snapshots")
          target.mkdir(parents=True,exist_ok=True)
          for market in ("SG","MY","CN"):
              url=f"https://raw.githubusercontent.com/kolihhan/freehirefetch/main/feed/ats/markets/{market}.json"
              try:
                  req=Request(url,headers={"User-Agent":"JobResourcesATSIntake/1.0"})
                  with urlopen(req,timeout=25) as res:
                      content=res.read(3_000_001)
                  if len(content)>3_000_000:raise ValueError("market snapshot exceeds bounded size")
                  snap=json.loads(content)
                  if snap.get("market") != market or not isinstance(snap.get("jobs"),list):
                      raise ValueError("wrong market/ATS schema")
                  (target/f"{market}.json").write_bytes(content)
                  print(f"VALID_ATS_SOURCE {market}: {len(snap['jobs'])} unverified role identities")
              except Exception as exc:
                  print(f"ATS_SOURCE_UNAVAILABLE {market}: {type(exc).__name__}: {str(exc)[:150]}")
          PY
      - name: Import public market API batches from freehirefetch
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request,urlopen
          base="https://raw.githubusercontent.com/kolihhan/freehirefetch/main/feed/market-api/"
          target=Path("artifacts/api-snapshots")
          target.mkdir(parents=True,exist_ok=True)
          def fetch(name):
              req=Request(base+name,headers={"User-Agent":"JobResourcesPublicBatchConsumer/1.0"})
              with urlopen(req,timeout=25) as res:
                  raw=res.read(3_000_001)
              if len(raw)>3_000_000:raise ValueError("oversized public API batch")
              return raw
          try:
              health=json.loads(fetch("health.json"))
              if not isinstance(health,dict):raise ValueError("invalid API health schema")
              (target/"health.json").write_text(json.dumps(health,indent=2)+"\n")
          except Exception as exc:
              print("UPSTREAM_API_BATCH_UNAVAILABLE",type(exc).__name__,str(exc)[:100])
              health={}
          for market in ("SG","MY","CN"):
              statuses=health.get(market,{})
              live=any(isinstance(x,dict) and x.get("status") in ("COMPLETE","PARTIAL")
                       for x in statuses.values()) if isinstance(statuses,dict) else False
              if not live:
                  print("API_MARKET_NOT_CURRENT",market)
                  continue
              try:
                  raw=fetch(market+".json")
                  data=json.loads(raw)
                  if data.get("market")!=market or not isinstance(data.get("jobs"),list):
                      raise ValueError("market snapshot contract")
                  (target/(market+".json")).write_bytes(raw)
                  print("PUBLIC_API_BATCH",market,len(data["jobs"]))
              except Exception as exc:
                  print("PUBLIC_API_SOURCE_UNAVAILABLE",market,type(exc).__name__,str(exc)[:100])
          try:
              (target/"platform-coverage.md").write_bytes(fetch("platform-coverage.md"))
          except Exception:
              pass
          PY
      - name: Branch dry-run or publish source-only queue update on main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            GITHUB_TOKEN="${{ github.token }}" python scripts/reconcile_pending_exact_issue.py \
              --repo . --report artifacts/exact-issue-reconciliation.json ||
              echo "::warning::Exact Issue duplicate ACK unavailable; preserve pending"
            python scripts/intake_official_ats.py \
              --repo . --snapshots artifacts/ats-snapshots \
              --api-dir artifacts/api-snapshots \
              --limit 12 --company-cap 3 \
              --report artifacts/ats-intake-report.json > artifacts/ats-intake-summary.md
            python scripts/enrich_pending_public_ats.py \
              --repo . --max-parts 36 --max-rows 80 \
              --report artifacts/ats-jd-enrichment.json >> artifacts/ats-intake-summary.md
            echo "Branch verification only: no source state pushed." >> artifacts/ats-intake-summary.md
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            committed=0
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              GITHUB_TOKEN="${{ github.token }}" python scripts/reconcile_pending_exact_issue.py \
                --repo . --report artifacts/exact-issue-reconciliation.json ||
                echo "::warning::Exact Issue duplicate ACK unavailable; preserve pending"
              python scripts/intake_official_ats.py \
                --repo . --snapshots artifacts/ats-snapshots \
              --api-dir artifacts/api-snapshots \
                --limit 12 --company-cap 3 \
                --report artifacts/ats-intake-report.json > artifacts/ats-intake-summary.md
              python scripts/enrich_pending_public_ats.py \
                --repo . --max-parts 36 --max-rows 80 \
                --report artifacts/ats-jd-enrichment.json >> artifacts/ats-intake-summary.md
              git add discovery-state/platform-index-sg.json \
                      discovery-state/platform-index-my.json \
                      discovery-state/platform-index-cn.json
              if git diff --cached --quiet; then
                echo "No new source IDs; historical metadata preserved." >> artifacts/ats-intake-summary.md
                committed=1
                break
              fi
              git commit -m "chore: durable official ATS source identities [skip ci]"
              if git push origin HEAD:main; then
                echo "Persisted source identities to main." >> artifacts/ats-intake-summary.md
                committed=1
                break
              fi
              echo "Concurrent update: replay source IDs on newest main (attempt $attempt/3)."
            done
            if [[ "$committed" != "1" ]]; then
              echo "::error::Source state could not be persisted after 3 attempts"
              exit 1
            fi
          fi
          cat artifacts/ats-intake-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish one actionable review worklist from durable queues
        run: |
          python scripts/build_review_dispatch.py \
            --repo . \
            --output artifacts/review-dispatch.json \
            --summary artifacts/review-dispatch.md \
            --limit 16 --track-reserve 4
          # The source-only AI evidence packet is also readable in job logs
          # by Chat Scouts; no second database or persistent score file.
          echo "SCOUT_EVIDENCE_PACKET_BEGIN"
          cat artifacts/review-dispatch.md
          echo "SCOUT_EVIDENCE_PACKET_END"
          cat artifacts/review-dispatch.md >> "$GITHUB_STEP_SUMMARY"
          if [[ -f artifacts/api-snapshots/platform-coverage.md ]]; then
            cat artifacts/api-snapshots/platform-coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
          head -n 20 artifacts/ats-intake-summary.md
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path("artifacts")
          files={"exact_issue_acks":"exact-issue-reconciliation.json",
                 "upstream_full_jds":"ats-jd-enrichment.json",
                 "source_intake":"ats-intake-report.json"}
          lines=["## Public-source / private-value handoff", "",
                 "Counts are provenance receipts, never eligible APPLY or contacted employers.",
                 "", "| Market | Private exact Issue ACK | Imported public JDs | New source Pending | Pending after |",
                 "|---|---:|---:|---:|---:|"]
          records={}
          for name,file in files.items():
              try: records[name]=json.loads((base/file).read_text())
              except (OSError,ValueError):records[name]={}
          for market in ("SG","MY","CN"):
              a=records["exact_issue_acks"].get("markets",{}).get(market,{})
              b=records["upstream_full_jds"].get("markets",{}).get(market,{})
              c=records["source_intake"].get("markets",{}).get(market,{})
              lines.append(f'| {market} | {a.get("verified_duplicates", "unavailable")} | '
                           f'{b.get("full_jd_imported", "unavailable")} | '
                           f'{c.get("created", "unavailable")} | '
                           f'{c.get("pending_after", "unavailable")} |')
          lines.extend(["","Only applicant-specific Scout verification creates APPLY/CHECK Issues."])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n".join(lines)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-ats-source-intake
          path: |
            artifacts/ats-intake-report.json
            artifacts/ats-jd-enrichment.json
            artifacts/exact-issue-reconciliation.json
            artifacts/ats-intake-summary.md
            artifacts/api-snapshots/health.json
            artifacts/api-snapshots/platform-coverage.md
            artifacts/review-dispatch.json
            artifacts/review-dispatch.md
          retention-days: 14
