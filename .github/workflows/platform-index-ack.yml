name: SG-MY Platform Index Acknowledgement Pilot

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/fixtures/platform-ack-*.json'
      - '.github/workflows/platform-index-ack.yml'

permissions:
  contents: write
  issues: read

concurrency:
  group: platform-index-queue
  cancel-in-progress: false

jobs:
  ack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Test fail-closed acknowledgement and source identity
        run: python -m unittest discover -s tests -p 'test_platform_index_queue.py' -v
      - name: Apply independently evidenced hard-gate receipts and preserve all other pending candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from platform_index_queue import ack, atomic_write, validate_state, verify_issue_readback
          for market in ('sg','my'):
              path=Path(f'discovery-state/platform-index-{market}.json')
              state=json.loads(path.read_text())
              for fixture in sorted(Path('tests/fixtures').glob(f'platform-ack-{market}-2026-11-07*.json')):
                  payload=json.loads(fixture.read_text())
                  receipts=payload if isinstance(payload,list) else [payload]
                  for receipt in receipts:
                      terminal=next((x for x in state['terminal'] if x['key']==receipt['key']),None)
                      if terminal:
                          assert terminal['state']==receipt['action'] and terminal.get('evidence_url')==receipt['evidence_url'], 'conflicting acknowledgement'
                      else:
                          proven=False
                          if receipt['action'] in ('ISSUE_VERIFIED','DUPLICATE_CONFIRMED'):
                              candidate=next((x for x in state['pending'] if x['key']==receipt['key']),None)
                              if candidate is None:
                                  raise ValueError('unknown pending candidate')
                              proven=verify_issue_readback(
                                  receipt.get('issue_url'),candidate['url'],os.environ.get('GITHUB_TOKEN',''))
                          state=ack(state,receipt,issue_proven=proven)
                          atomic_write(path,state)
              validate_state(state,market.upper())
              print(f"ACK {market.upper()} pending={len(state['pending'])} terminal={len(state['terminal'])} cursor={state['next_unacknowledged_seq']}")
          PY
            git add discovery-state/platform-index-sg.json discovery-state/platform-index-my.json
            if git diff --cached --quiet; then
              echo "Receipts already applied exactly; no state mutation."
              exit 0
            fi
            git commit -m "chore: close JD-verified hard rejects without losing pending jobs [skip ci]"
            if git push origin HEAD:main; then
              echo "Persisted evidence-backed receipts."
              exit 0
            fi
            echo "Optimistic retry ${attempt}/3 after concurrent state update."
          done
          exit 1
      - name: Confirm live state on origin
        run: |
          git fetch origin main
          python - <<'PY'
          import json,subprocess
          for market in ('sg','my'):
              data=subprocess.check_output(['git','show',f'origin/main:discovery-state/platform-index-{market}.json'])
              s=json.loads(data)
              # Initial two observed candidates per market must now have documented terminal dispositions.
              # Later source-ingestion additions are allowed to remain pending.
              assert all(any(x['seq']==n for x in s['terminal']) for n in (1,2))
              assert s['next_unacknowledged_seq']==min([x['seq'] for x in s['pending']],default=s['next_seq'])
              print(f"{market}: initial two candidates have evidence-backed terminal receipts; pending={len(s['pending'])}")
          PY
