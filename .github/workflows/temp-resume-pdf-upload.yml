name: One-shot resume cleanup

on:
  push:
    paths:
      - '.github/workflows/temp-resume-pdf-upload.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate final resume PDFs and remove temporary upload files
        shell: bash
        run: |
          set -euo pipefail
          test -f resumes/Ko_Lih_Han_Resume_EN.pdf
          test -f resumes/Ko_Lih_Han_Resume_CN.pdf
          cp resumes/Ko_Lih_Han_Resume_EN.pdf resumes/resume-en-current.pdf
          cp resumes/Ko_Lih_Han_Resume_CN.pdf resumes/resume-cn-current.pdf
          test "$(sha256sum resumes/Ko_Lih_Han_Resume_EN.pdf | cut -d' ' -f1)" = "$(sha256sum resumes/resume-en-current.pdf | cut -d' ' -f1)"
          test "$(sha256sum resumes/Ko_Lih_Han_Resume_CN.pdf | cut -d' ' -f1)" = "$(sha256sum resumes/resume-cn-current.pdf | cut -d' ' -f1)"
          rm -f resumes/Ko_Lih_Han_Resume_EN.pdf resumes/Ko_Lih_Han_Resume_CN.pdf
          rm -rf .resume-upload
          rm -f .github/workflows/temp-resume-pdf-upload.yml
      - name: Commit clean resume state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate final resume PDFs and clean upload artifacts'
          git push
