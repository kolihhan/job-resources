name: CN Discovery

on:
  workflow_dispatch:
  schedule:
    # Fifteen minutes after freehirefetch public source (UTC :05) for private evaluation.
    - cron: "20 1,4,7,10,13,16,19,22 * * *"
  push:
    paths:
      - "scripts/build_cn_source_handoff.py"
      - "tests/test_cn_source_handoff.py"
      - ".github/workflows/cn-liepin-discovery.yml"

permissions:
  contents: write

concurrency:
  group: cn-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Validate private source handoff and Issue-safe schema
        run: python -m unittest discover -s tests -p 'test_cn_source_handoff.py' -v

      - name: Import validated CN native public batches from freehirefetch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          from urllib.request import Request,urlopen
          base='https://raw.githubusercontent.com/kolihhan/freehirefetch/main/feed/cn-native/'
          folder=Path('artifacts')
          folder.mkdir(parents=True,exist_ok=True)
          def read(name, max_size=3_000_000):
              assert name in ('liepin-raw.json','health.json',
                              'jobpro-ai.json','jobpro-backend.json','jobpro-swe.json')
              req=Request(base+name,headers={'User-Agent':'JobResourcesCNPublicBatchConsumer/1.0'})
              with urlopen(req,timeout=25) as response:
                  raw=response.read(max_size+1)
              if len(raw)>max_size:raise ValueError('oversized upstream CN batch: '+name)
              return raw,json.loads(raw)
          _,health=read('health.json',100_000)
          checked=datetime.fromisoformat(health['checked_at'].replace('Z','+00:00'))
          now=datetime.now(timezone.utc)
          if checked.tzinfo is None or checked>now+timedelta(minutes=5) or now-checked>timedelta(hours=8):
              raise ValueError('public CN native source stale; preserve private pending')
          raw,liepin=read('liepin-raw.json')
          generated=datetime.fromisoformat(liepin['generatedAt'].replace('Z','+00:00'))
          if generated.tzinfo is None or generated>now+timedelta(minutes=5) or now-generated>timedelta(hours=8):
              raise ValueError('public Liepin batch stale; preserve private pending')
          if liepin.get('source')!='liepin-public-api' or not isinstance(liepin.get('jobs'),list) or not isinstance(liepin.get('searches'),list):
              raise ValueError('invalid upstream Liepin batch schema')
          if not isinstance(liepin.get('meta'),dict) or not isinstance(liepin.get('failedPages'),list):
              raise ValueError('invalid Liepin source health schema')
          if not isinstance(health.get('liepin'),dict):
              raise ValueError('missing public Liepin health')
          if health['liepin'].get('status') not in ('SOURCE_SAMPLE_COMPLETED','PARTIAL_COVERAGE'):
              raise ValueError('upstream Liepin source unverified')
          ids=[str(j.get('sourceId') or '') for j in liepin['jobs'] if isinstance(j,dict)]
          if len(ids)!=len(liepin['jobs']) or not all(ids) or len(set(ids))!=len(ids):
              raise ValueError('upstream Liepin exact IDs invalid or repeated')
          (folder/'liepin-raw.json').write_bytes(raw)
          for name in ('ai','backend','swe'):
              raw,obj=read('jobpro-'+name+'.json')
              if not isinstance(obj,dict) or not isinstance(obj.get('results'),list):
                  raise ValueError('upstream public employer feed schema invalid: '+name)
              (folder/('jobpro-'+name+'.json')).write_bytes(raw)
          print('PUBLIC_CN_LIEPIN',len(ids),'source IDs, publisher checked:',health['checked_at'])
          print('PUBLIC_CN_JOBPRO',3,'query batches; applicant matching remains private')
          PY

      - name: Write run summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const liepin = JSON.parse(fs.readFileSync('artifacts/liepin-raw.json', 'utf8'));
          const page1WithNext = liepin.searches.filter(p => p.page === 1 && p.totalPage >= 2);
          const missingPage2 = page1WithNext.filter(p => !liepin.searches.some(q => q.city === p.city && q.query === p.query && q.page === 2));
          // A missing second page is an unfinished source debt, not a reason to throw away other sources.
          const incompleteQueries = liepin.failedPages ?? [];
          const files = ['ai', 'backend', 'swe'].map((name) => `artifacts/jobpro-${name}.json`);
          const jobproRuns = files.map((file) => JSON.parse(fs.readFileSync(file, 'utf8')));
          const jobs = new Map();
          let failed = 0;
          let reportedHits = 0;
          for (const run of jobproRuns) {
            failed += Array.isArray(run.failed) ? run.failed.length : 0;
            reportedHits += Number(run.total ?? 0);
            for (const result of run.results ?? []) {
              for (const job of result.positions ?? []) {
                const key = `${result.company}|${job.post_id ?? job.apply_url ?? `${job.title ?? ''}|${job.work_cities ?? ''}`}`;
                if (!jobs.has(key)) jobs.set(key, { source: 'job-pro', company_key: result.company, ...job });
              }
            }
          }
          const official = {
            meta: {
              package: '@ha7ch/job-pro@1.2.1',
              queries: jobproRuns.map((run) => run.keyword),
              reported_hits: reportedHits,
              unique_jobs: jobs.size,
              failed_adapter_calls: failed,
            },
            jobs: [...jobs.values()],
          };
          fs.writeFileSync('artifacts/jobpro-raw.json', JSON.stringify(official, null, 2));
          const lines = [
            '# CN Discovery',
            '',
            '## Liepin',
            `- searches: ${liepin.meta.searchCount}`,
            `- first-page queries with page 2 available: ${page1WithNext.length}`,
            `- verified page 2 requests: ${liepin.searches.filter(p => p.page === 2).length}`,
            `- source exhausted: not claimed if more pages remain`,
            `- source quality: ${liepin.meta.runQuality}`,
            `- failed city/query/pages: ${incompleteQueries.length}; unverified page-two attempts: ${missingPage2.length}`,
            `- unique jobs: ${liepin.meta.uniqueJobs}`,
            `- duplicates removed: ${liepin.meta.duplicatesRemoved}`,
            `- malformed cards skipped: ${liepin.meta.skippedMalformed}`,
            '',
            '## Official-company APIs (job-pro 1.2.1)',
            `- queries: ${official.meta.queries.join(', ')}`,
            `- reported hits before cross-query dedupe: ${official.meta.reported_hits}`,
            `- unique jobs after cross-query dedupe: ${official.meta.unique_jobs}`,
            `- failed adapter calls: ${official.meta.failed_adapter_calls}`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Test source candidate projection and sharding
        run: python -m unittest discover -s tests -p 'test_cn_source_handoff.py' -v

      - name: Export bounded candidate handoff without creating GitHub Issues
        run: |
          python scripts/build_cn_source_handoff.py \
            --liepin artifacts/liepin-raw.json \
            --jobpro artifacts/jobpro-raw.json \
            --known discovery-state/known-role-index.json \
            --output-dir artifacts \
            --run-id "$GITHUB_RUN_ID"

      - name: Validate handoff manifest and unique candidate identities
        run: |
          python - <<'PY'
          import json
          import hashlib
          from pathlib import Path
          p = Path('artifacts')
          m = json.loads((p/'cn-source-manifest.json').read_text())
          shards = [json.loads((p/name).read_text()) for name in m['shards']]
          rows = [r for shard in shards for r in shard['candidates']]
          ids = [r['source_key'] for r in rows]
          assert len(rows) == m['candidate_count']
          assert len(ids) == len(set(ids))
          assert hashlib.sha256('\n'.join(ids).encode()).hexdigest() == m['identity_sha256']
          assert m['status'] == 'AWAITING_VERIFICATION'
          print(f"Verified source candidate handoff: {len(ids)} IDs in {len(shards)} shards; NO APPLY/CHECK issues created")
          if not m['unique_source_identifiers']:
              raise SystemExit('FAIL: no parseable exact job identities from any source; source discovery remains incomplete')
          PY

      - name: Persist bounded native Liepin AI job IDs to existing CN source queue
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          committed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from intake_official_ats import process_market
          from platform_index_queue import atomic_write,new_state
          market="CN"
          root=Path("discovery-state")
          state_path=root/"platform-index-cn.json"
          snapshot=json.loads(Path("artifacts/cn-native-source.json").read_text())
          state=json.loads(state_path.read_text()) if state_path.exists() else new_state(market)
          known=json.loads((root/"known-role-index.json").read_text())
          updated,stats=process_market(market,snapshot,state,known,
                                       limit=10,company_cap=2,max_pending=45)
          # process_market/ingest mutate the state in place, so checking
          # object inequality here would silently drop every new receipt.
          if stats["created"]:
              atomic_write(state_path,updated)
          result={"native_liepin_source_rows":len(snapshot["jobs"]),
                  "queued_unverified":stats["created"],
                  "pending_after":stats["pending_after"],
                  "deferred_unhandled":stats.get("deferred_unhandled_ids",0),
                  "coverage_gaps":stats["coverage_gaps"]}
          print(json.dumps(result,ensure_ascii=False))
          with open("artifacts/cn-native-queue-result.json","w") as out:
              json.dump(result,out,ensure_ascii=False,indent=2)
          PY
            git add discovery-state/platform-index-cn.json
            if git diff --cached --quiet; then
              echo "Native platform identities already seen, or review queue at capacity."
              committed=1
              break
            fi
            git commit -m "chore: persist CN native Liepin source IDs [skip ci]"
            if git push origin HEAD:main; then
              echo "CN native source IDs saved to existing source queue."
              committed=1
              break
            fi
            echo "Concurrent job queue update; replay latest state ($attempt/3)."
          done
          test "$committed" -eq 1
          cat artifacts/cn-native-queue-result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cn-raw-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
