name: Sync current resume PDFs
on:
  push:
    paths:
      - ".tmp/resume-pdf-sync/READY"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation poppler-utils
          python -m pip install --disable-pip-version-check weasyprint
      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from weasyprint import HTML
          HTML(".tmp/resume-en-current.html").write_pdf("resumes/resume-en-current.pdf")
          HTML(".tmp/resume-cn-current.html").write_pdf("resumes/resume-cn-current.pdf")
          PY
          test "$(pdfinfo resumes/resume-en-current.pdf | awk '/^Pages:/ {print $2}')" = "1"
          test "$(pdfinfo resumes/resume-cn-current.pdf | awk '/^Pages:/ {print $2}')" = "1"
          pdftotext resumes/resume-en-current.pdf /tmp/en.txt
          pdftotext resumes/resume-cn-current.pdf /tmp/cn.txt
          grep -F "Primary developer for a production feedback platform" /tmp/en.txt
          grep -F "58% execution-match rate" /tmp/en.txt
          grep -F "RRF improved Recall@10" /tmp/en.txt
          grep -F "作为主要开发者负责生产环境反馈平台" /tmp/cn.txt
          grep -F "58% execution-match" /tmp/cn.txt
          ! grep -qi "project-local scorer" /tmp/en.txt
          ! grep -qi "exposing the trade-offs" /tmp/en.txt
          ! grep -qi "QLoRA" /tmp/en.txt
      - name: Commit PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resumes/resume-en-current.pdf resumes/resume-cn-current.pdf
          git rm .tmp/resume-en-current.html .tmp/resume-cn-current.html .tmp/resume-pdf-sync/READY
          git rm .github/workflows/sync-resume-pdfs.yml
          git commit -m "Apply reviewer-led resume rewrite"
          git push
