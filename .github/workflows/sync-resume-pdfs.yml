name: Sync current resume PDFs

on:
  push:
    paths:
      - ".tmp/resume-pdf-sync/READY"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation poppler-utils
          python -m pip install --disable-pip-version-check weasyprint

      - name: Build and verify resumes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from weasyprint import HTML
          HTML(".tmp/resume-en-current.html").write_pdf("resumes/resume-en-current.pdf")
          HTML(".tmp/resume-cn-current.html").write_pdf("resumes/resume-cn-current.pdf")
          PY

          test "$(pdfinfo resumes/resume-en-current.pdf | awk '/^Pages:/ {print $2}')" = "1"
          test "$(pdfinfo resumes/resume-cn-current.pdf | awk '/^Pages:/ {print $2}')" = "1"

          pdftotext resumes/resume-en-current.pdf /tmp/en.txt
          pdftotext resumes/resume-cn-current.pdf /tmp/cn.txt

          grep -F "production Laravel/Vue.js experience" /tmp/en.txt
          grep -F "58/100" /tmp/en.txt
          grep -F "0.7630" /tmp/en.txt
          grep -F "50.0%" /tmp/en.txt
          ! grep -qi "QLoRA" /tmp/en.txt

          grep -F "Laravel / Vue.js 生产系统开发经验" /tmp/cn.txt
          grep -F "58/100" /tmp/cn.txt
          grep -F "0.7630" /tmp/cn.txt
          grep -F "50.0%" /tmp/cn.txt
          ! grep -qi "QLoRA" /tmp/cn.txt

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-resume-pdfs
          path: |
            resumes/resume-en-current.pdf
            resumes/resume-cn-current.pdf
          if-no-files-found: error

      - name: Commit verified PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resumes/resume-en-current.pdf resumes/resume-cn-current.pdf
          git rm .tmp/resume-en-current.html .tmp/resume-cn-current.html .tmp/resume-pdf-sync/READY
          git rm .github/workflows/sync-resume-pdfs.yml
          git commit -m "Refine current resume layout and copy"
          git push
