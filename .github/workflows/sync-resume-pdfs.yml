name: Sync resume PDF spacing

on:
  push:
    paths:
      - ".tmp/resume-pdf-sync/READY"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation poppler-utils
          python -m pip install --disable-pip-version-check "weasyprint==68.0" pymupdf

      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          python .tmp/resume-build.py

          test "$(pdfinfo resumes/resume-en-current.pdf | awk '/^Pages:/ {print $2}')" = "1"
          test "$(pdfinfo resumes/resume-cn-current.pdf | awk '/^Pages:/ {print $2}')" = "1"
          pdfinfo resumes/resume-en-current.pdf | grep -F "A4"
          pdfinfo resumes/resume-cn-current.pdf | grep -F "A4"

          pdftotext resumes/resume-en-current.pdf /tmp/en.txt
          pdftotext resumes/resume-cn-current.pdf /tmp/cn.txt

          grep -F "centralizing submissions" /tmp/en.txt
          grep -F "58/100 execution-result matches" /tmp/en.txt
          grep -F "frozen 64-query EnterpriseRAG-Bench slice" /tmp/en.txt
          grep -F "0.6890 automated semantic F1 versus 0.6250" /tmp/en.txt
          ! grep -qi "Hermes Video Tutor" /tmp/en.txt
          ! grep -Eqi '(^|[^A-Za-z])(AWS|Redis)([^A-Za-z]|$)' /tmp/en.txt

          grep -F "教育背景" /tmp/cn.txt
          grep -F "已上线的 POS 系统功能" /tmp/cn.txt
          grep -F "执行结果匹配为 58/100" /tmp/cn.txt
          grep -F "EnterpriseRAG-Bench 固定切片" /tmp/cn.txt
          grep -F "0.6890" /tmp/cn.txt
          ! grep -qi "Hermes Video Tutor" /tmp/cn.txt
          ! grep -Eqi '(^|[^A-Za-z])(AWS|Redis)([^A-Za-z]|$)' /tmp/cn.txt

          pdffonts resumes/resume-cn-current.pdf | grep -Eq "NotoSansCJK|Noto-Sans-CJK"
          pdffonts resumes/resume-en-current.pdf | grep -F "Liberation"
          test "$(pdfdetach -list resumes/resume-en-current.pdf 2>/dev/null | awk '/embedded files/ {print $1}' || true)" != "1"

          python - <<'PY'
          import fitz
          expected = {
              "resumes/resume-en-current.pdf": (775, 800),
              "resumes/resume-cn-current.pdf": (765, 800),
          }
          for path, (lo, hi) in expected.items():
              doc = fitz.open(path)
              assert len(doc) == 1, (path, len(doc))
              page = doc[0]
              words = page.get_text("words")
              bottom = max(w[3] for w in words)
              links = [x for x in page.get_links() if x.get("uri")]
              assert lo <= bottom <= hi, (path, bottom)
              assert len(links) == 4, (path, len(links))
              margin_mm = (841.89 - bottom) * 25.4 / 72
              print(f"{path}: bottom={bottom:.2f}pt, bottom_margin={margin_mm:.1f}mm, links={len(links)}")
          PY

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-resume-pdfs
          path: |
            resumes/resume-en-current.pdf
            resumes/resume-cn-current.pdf
          if-no-files-found: error

      - name: Commit verified PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resumes/resume-en-current.pdf resumes/resume-cn-current.pdf
          git rm .tmp/resume-build.py .tmp/resume-pdf-sync/READY
          git rm .github/workflows/sync-resume-pdfs.yml
          git commit -m "Improve resume page density"
          git push
