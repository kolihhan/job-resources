name: Sync current resume PDFs

on:
  push:
    paths:
      - ".tmp/resume-pdf-sync/READY"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify PDFs
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/resume-pdf-sync/en/part-* | base64 -d > resumes/resume-en-current.pdf
          cat .tmp/resume-pdf-sync/cn/part-* | base64 -d > resumes/resume-cn-current.pdf

          test "$(stat -c%s resumes/resume-en-current.pdf)" -eq 61042
          test "$(stat -c%s resumes/resume-cn-current.pdf)" -eq 93545
          echo "66e3c41bf64e5e5ea39e0e4b7f49edaf6826fd1adaaabe05ad45ec7798b2dc62  resumes/resume-en-current.pdf" | sha256sum -c -
          echo "3cc36cbb4229098e22d326a69304c037c7ee33206cefdff3e74ada02cdc7c955  resumes/resume-cn-current.pdf" | sha256sum -c -

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resumes/resume-en-current.pdf resumes/resume-cn-current.pdf
          git rm -r .tmp/resume-pdf-sync
          git rm .github/workflows/sync-resume-pdfs.yml
          git commit -m "Update verified current resume PDFs"
          git push
