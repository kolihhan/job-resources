name: Build verified current resume PDFs

on:
  push:
    paths:
      - ".tmp/resume-build/READY"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk ghostscript poppler-utils
          python -m pip install --quiet "weasyprint==68.0"

      - name: Build and verify resumes
        shell: bash
        run: |
          set -euo pipefail
          python .tmp/resume-build/build.py

          weasyprint .tmp/resume-build/resume-en-current.html /tmp/resume-en.raw.pdf
          weasyprint .tmp/resume-build/resume-cn-current.html /tmp/resume-cn.raw.pdf

          gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.6 -dPDFSETTINGS=/ebook              -dNOPAUSE -dQUIET -dBATCH              -sOutputFile=resumes/resume-en-current.pdf /tmp/resume-en.raw.pdf
          gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.6 -dPDFSETTINGS=/ebook              -dNOPAUSE -dQUIET -dBATCH              -sOutputFile=resumes/resume-cn-current.pdf /tmp/resume-cn.raw.pdf

          test "$(head -c 5 resumes/resume-en-current.pdf)" = "%PDF-"
          test "$(head -c 5 resumes/resume-cn-current.pdf)" = "%PDF-"
          test "$(pdfinfo resumes/resume-en-current.pdf | awk '/^Pages:/ {print $2}')" = "1"
          test "$(pdfinfo resumes/resume-cn-current.pdf | awk '/^Pages:/ {print $2}')" = "1"

          pdftotext resumes/resume-en-current.pdf /tmp/en.txt
          pdftotext resumes/resume-cn-current.pdf /tmp/cn.txt
          grep -Fq "KO LIH HAN" /tmp/en.txt
          grep -Fq "Information Systems & Applications" /tmp/en.txt
          grep -Fq "高立恒" /tmp/cn.txt
          grep -Fq "资讯系统与应用研究所" /tmp/cn.txt

          sha256sum resumes/resume-en-current.pdf resumes/resume-cn-current.pdf
          ls -lh resumes/resume-en-current.pdf resumes/resume-cn-current.pdf

      - name: Commit PDFs and remove one-shot staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add resumes/resume-en-current.pdf resumes/resume-cn-current.pdf
          git rm -r .tmp/resume-build
          if [ -d .tmp/resume-upload ]; then git rm -r .tmp/resume-upload; fi
          git rm .github/workflows/assemble-resume.yml

          git commit -m "Add verified current resume PDFs"
          git push
