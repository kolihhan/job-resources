name: Assemble current resume PDF

on:
  push:
    paths:
      - ".tmp/resume-upload/READY"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble verified PDF
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/resume-upload/part-00 \
            .tmp/resume-upload/part-01 \
            .tmp/resume-upload/part-02 \
            .tmp/resume-upload/part-03 \
            .tmp/resume-upload/part-04 \
            .tmp/resume-upload/part-05 \
            .tmp/resume-upload/part-06 \
            .tmp/resume-upload/part-07 \
            .tmp/resume-upload/part-08 \
            .tmp/resume-upload/part-09a \
            .tmp/resume-upload/part-09b0 \
            .tmp/resume-upload/part-09b1 \
            .tmp/resume-upload/part-09b2 \
            .tmp/resume-upload/part-09b3 \
            > /tmp/resume.b64
          test "$(stat -c%s /tmp/resume.b64)" -eq 69320
          base64 -d /tmp/resume.b64 > resumes/resume-en-current.pdf
          test "$(head -c 5 resumes/resume-en-current.pdf)" = "%PDF-"
          test "$(stat -c%s resumes/resume-en-current.pdf)" -eq 51990
          test "$(sha256sum resumes/resume-en-current.pdf | awk '{print $1}')" = "b05e4f8f3a040429eaeacb149fd1a60f716b687eb67a54067369b737c11d55e3"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resumes/resume-en-current.pdf
          git rm -r .tmp/resume-upload
          git rm .github/workflows/assemble-resume.yml
          git commit -m "Add current English resume PDF"
          git push
