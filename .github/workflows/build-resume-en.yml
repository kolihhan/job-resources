name: Build English resume PDF

on:
  push:
    branches: [main]
    paths:
      - 'resumes/resume-en-current.tex'
      - 'resumes/resume-en-current.md'
      - '.github/workflows/build-resume-en.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build LaTeX resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume-en-current.tex
          working_directory: resumes

      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify PDF
        run: |
          test "$(pdfinfo resumes/resume-en-current.pdf | awk '/^Pages:/ {print $2}')" = "1"
          pdftotext -layout resumes/resume-en-current.pdf /tmp/resume.txt
          grep -q 'Small-Agent QLoRA' /tmp/resume.txt
          grep -q 'Semantic Text-to-SQL' /tmp/resume.txt
          grep -q '34.5% to 62.0%' /tmp/resume.txt
          grep -q '75% to 90%' /tmp/resume.txt
          grep -q 'Kahap Inc' /tmp/resume.txt
          grep -q '4.09/4.3' /tmp/resume.txt

      - name: Commit generated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resumes/resume-en-current.pdf
          if git diff --cached --quiet; then
            echo 'PDF unchanged'
          else
            git commit -m 'Update generated English resume PDF'
            git push
          fi
