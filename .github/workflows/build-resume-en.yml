name: Build current resume PDFs

on:
  push:
    branches: [main]
    paths:
      - 'resumes/resume-en-current.tex'
      - 'resumes/resume-en-current.md'
      - 'resumes/resume-zh-current.tex'
      - 'resumes/resume-zh-current.md'
      - '.github/workflows/build-resume-en.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XeLaTeX, Chinese support, fonts, and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-latex-extra \
            fonts-noto-core \
            fonts-noto-cjk \
            poppler-utils
          fc-cache -f

      - name: Build English resume
        working-directory: resumes
        run: xelatex -interaction=nonstopmode -halt-on-error resume-en-current.tex

      - name: Build Chinese resume
        working-directory: resumes
        run: xelatex -interaction=nonstopmode -halt-on-error resume-zh-current.tex

      - name: Verify PDFs
        run: |
          test "$(pdfinfo resumes/resume-en-current.pdf | awk '/^Pages:/ {print $2}')" = "1"
          test "$(pdfinfo resumes/resume-zh-current.pdf | awk '/^Pages:/ {print $2}')" = "1"

          pdftotext -layout resumes/resume-en-current.pdf /tmp/resume-en.txt
          grep -q 'Small-Agent QLoRA' /tmp/resume-en.txt
          grep -q 'Semantic Text-to-SQL' /tmp/resume-en.txt
          grep -q '34.5% to 62.0%' /tmp/resume-en.txt
          grep -q '33% to 39%' /tmp/resume-en.txt
          grep -q 'Interpreting Implicit Intent through Workplace' /tmp/resume-en.txt
          grep -q '4.09/4.3' /tmp/resume-en.txt

          pdftotext -layout resumes/resume-zh-current.pdf /tmp/resume-zh.txt
          grep -q 'Small-Agent QLoRA' /tmp/resume-zh.txt
          grep -q 'Semantic Text-to-SQL' /tmp/resume-zh.txt
          grep -q '34.5%' /tmp/resume-zh.txt
          grep -q '62.0%' /tmp/resume-zh.txt
          grep -q '4.09/4.3' /tmp/resume-zh.txt

      - name: Commit generated PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resumes/resume-en-current.pdf resumes/resume-zh-current.pdf
          if git diff --cached --quiet; then
            echo 'PDFs unchanged'
          else
            git commit -m 'Update generated resume PDFs'
            git push
          fi
