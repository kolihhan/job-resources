name: Update job experience ownership evidence

on:
  push:
    paths:
      - '.github/workflows/update-job-experience-ownership.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch interview job-experience MD
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/interview-resume-job-experience.md')
          s=p.read_text()

          s=s.replace(
          '| SSL | Career README 有 Certbot check/renew＋Nginx restart；SuggestionBox forceScheme 不等於TLS部署 | `career/README.md:97–103`、`suggestionbox/app/Providers/AppServiceProvider.php` |',
          '| SSL / production OS | **USER-CONFIRMED:** SuggestionBox production 由本人用 **Certbot + Let’s Encrypt** 配 HTTPS；production 曾用 **Ubuntu 22.04 / 24.04**。`forceScheme` 仍只算 application-side CONFIG。Career README 另有 Certbot check/renew＋Nginx restart。 | Career README、SuggestionBox provider；本人確認的 production 操作 |')

          s=s.replace(
          '| 個人歸屬 | USER的0→1設計參與可保留；SuggestionBox Git 明確多人，不能全數獨攬 | SuggestionBox考古文件歷史Git摘錄；原`.git`不發布 |',
          '| Career 個人歸屬 | `career-git.zip` 補回完整 Git history；本人確認 `kolihhan`、`kolih`、`LIH HAN KO`、`高立恒`、`DESKTOP-96L42D8\\lihha` 全是本人。五個 identity 合計 **516 / 1,176 commits**，範圍 **2022-08-04 → 2026-08-31**。 | `job-project/docs/career-code-archaeology.md` 的 Git-confirmed ownership section |')

          marker='## Queue vs job vs worker vs scheduler／cron\n'
          insert='''## Career：Git-confirmed 本人實際做過的東西\n\n`CONFIG + USER-CONFIRMED IDENTITY`：額外提供的 `career-git.zip` 是完整 Career Git history。以下五個 author identity 全部由本人確認是自己：\n\n- `kolihhan <ko.lih@kahap.com>` — 306 commits\n- `kolih <ko.lih@kahap.com>` — 108 commits\n- `DESKTOP-96L42D8\\lihha <lihhanko3@gmail.com>` — 93 commits\n- `高立恒 <ko.lih@kahap.com>` — 7 commits\n- `LIH HAN KO <ko.lih@kahap.com>` — 2 commits\n- **Total: 516 unique commits / repo 1,176 commits**\n- **Date range: 2022-08-04 → 2026-08-31**\n\n這代表 Career 不應再描述成「只改一點 CSS」。Git 直接支持本人長期做大量 production maintenance、bug fixing 與 feature work。最適合面試記憶的 commits：\n\n| Commit | 直接可說的工作 |\n|---|---|\n| `57352fe0` | 第三方後台登入功能；auth/controller/route 類修改 |\n| `9b45ef74` | 實習老師 API：學生資料、實習紀錄、實習機構列表 |\n| `c398c2c3` | 使用者修改密碼流程修正；簡單 maintenance/debug 例子 |\n| `ff6eb4a8` | 學生集點紀錄活動類型錯誤顯示修正 |\n| `25477bc3` | 企業申請實習時自動帶入既有資料；跨 Laravel API + Vue/store/API service |\n| `6cc473ea` | API 報錯、表單欄位與 model/resource/schema 類調整 |\n| `18abd37d` | 真實 CSS/UI design 維護；CSS 只是整體工作的一小部分 |\n| `0c830242` | 企業更新資料判斷 + 前後台校園徵才活動一致性修正 |\n\n**安全說法：**「我接手一個既有 Laravel/Vue production system，長期做 bug fixing、API/表單/實習/點數/admin/front-end 功能維護與新增。」不要把其他作者 commits 或整個平台全部功能都說成自己從零寫。\n\n## Pac Com：簡短準備，不與 Career 混用\n\n`USER`：Pac Com 是更早期的實習，主要在既有 **Laravel + Vue POS** 系統做簡單 maintenance：小型 bug fix、UI/CSS/layout 調整、既有功能維護。這段經歷的主要學習價值是第一次在真實專案裡理解並使用 Laravel framework。\n\n目前沒有找到可對應 Pac Com 的 source repo 或 Git history；`career-git.zip` 明確是 2022-08 之後的 NTUST Career history，**不能拿 Career commits 冒充 Pac Com**。\n\n面試安全版：\n\n> At Pac Com I worked on an existing Laravel/Vue POS system. The tasks were relatively straightforward: maintaining existing features, fixing smaller application or UI issues, and making CSS/layout adjustments. It was where I first learned how a real Laravel application is structured and maintained.\n\n如果被追 Laravel，講你當時建立的基礎 mental model：route → controller → model/database → Blade/Vue response；不要虛構複雜 production incident。\n\n'''
          if marker not in s:
              raise SystemExit('queue marker not found')
          if '## Career：Git-confirmed 本人實際做過的東西' not in s:
              s=s.replace(marker,insert+marker)

          old='''**USER** 你說做過SuggestionBox部署、Career搬server與HTTPS；具體操作仍由你回憶。**UNKNOWN** 舊新機／OS、備份還原工具、media搬法、DNS cutover／TTL、停機、rollback、驗收、Certbot plugin／challenge／renew timer。資料migration檔不是server migration紀錄。'''
          new='''**USER-CONFIRMED** SuggestionBox production deployment 由本人負責；production 曾跑在 **Ubuntu 22.04 / 24.04**，HTTPS 使用 **Certbot + Let’s Encrypt**。Career 亦有本人搬 server／HTTPS 的記憶，且 README 有 Certbot/Nginx 維運背景。**UNKNOWN** 仍包括每次搬遷的舊新機對應版本、完整 backup/restore、media 搬法、DNS cutover／TTL、停機、rollback、驗收，以及當時 Certbot plugin/challenge 的精確選項。資料 migration 檔不是 server migration 紀錄。'''
          if old not in s:
              raise SystemExit('SSL USER marker not found')
          s=s.replace(old,new)

          s=s.replace(
          '**CONFIG/Git** SuggestionBox kolihhan的`a997328`／`e331dff`涉及email_status和重複通知；`a9a4be5`涉及成案／留言。這些是回憶入口，commit subject不能自動變成完整事故故事。',
          '**CONFIG/Git + USER-CONFIRMED IDENTITY** SuggestionBox 的 `kolihhan`／相關已確認本人 alias commits 可作個人貢獻證據；`a997328`／`e331dff`涉及 email_status 和重複通知，`a9a4be5`涉及成案／留言。Career 另有 516 個本人確認 commits，包含密碼、API、點數、實習、表單、UI 等大量真實 maintenance。commit subject 是回憶入口，仍不要把 subject 擴寫成沒發生過的事故故事。')

          p.write_text(s)
          PY

      - name: Verify patch
        run: |
          grep -q '516 unique commits / repo 1,176 commits' docs/interview-resume-job-experience.md
          grep -q 'Pac Com：簡短準備' docs/interview-resume-job-experience.md
          grep -q 'Certbot + Let’s Encrypt' docs/interview-resume-job-experience.md
          grep -q 'Ubuntu 22.04 / 24.04' docs/interview-resume-job-experience.md
          grep -q '57352fe0' docs/interview-resume-job-experience.md
          grep -q '0c830242' docs/interview-resume-job-experience.md
          ! grep -q 'Career 個人歸屬 | USER的0→1設計參與可保留' docs/interview-resume-job-experience.md

      - name: Commit and push
        run: |
          git config user.name 'kolihhan'
          git config user.email '60084149+kolihhan@users.noreply.github.com'
          git add docs/interview-resume-job-experience.md
          git commit -m 'docs: confirm Career ownership and Pac Com scope'
          git push origin HEAD:main
