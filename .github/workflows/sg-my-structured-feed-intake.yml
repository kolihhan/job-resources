name: SG MY Structured Feed Intake
on:
  workflow_dispatch:
  schedule:
    # 10:40 and 22:40 Malaysia time; bounded public API, not high-rate scraping.
    - cron: '40 2,14 * * *'
  push:
    paths:
      - 'scripts/collect_devglobal_source.py'
      - 'tests/test_collect_devglobal_source.py'
      - 'scripts/platform_index_queue.py'
      - 'tests/test_platform_index_queue.py'
      - '.github/workflows/sg-my-structured-feed-intake.yml'
permissions:
  contents: write
  issues: read
concurrency:
  group: platform-index-queue
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Unit tests (source scope, identity, continuation)
        run: |
          python -m unittest discover -s tests -p 'test_collect_devglobal_source.py' -v
          python -m unittest discover -s tests -p 'test_platform_index_queue.py' -v
      - name: Import published DevGlobal public batches from freehirefetch
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError, URLError
          target=Path('artifacts')
          target.mkdir(parents=True,exist_ok=True)
          for market in ('sg','my'):
              url=f'https://raw.githubusercontent.com/kolihhan/freehirefetch/main/feed/devglobal/devglobal-{market}-candidates.json'
              req=Request(url,headers={'User-Agent':'JobResourcesDevGlobalPublicBatchConsumer/1.0'})
              try:
                  with urlopen(req,timeout=25) as r:
                      raw=r.read(2_000_001)
                  if len(raw)>2_000_000:raise ValueError('oversized DevGlobal batch')
                  data=json.loads(raw)
                  at=datetime.fromisoformat(data['observed_at'].replace('Z','+00:00'))
                  if (at.tzinfo is None or not
                      datetime.now(timezone.utc)-timedelta(hours=24)<=at<=datetime.now(timezone.utc)+timedelta(minutes=5)):
                      raise ValueError('stale/future published source')
                  if data.get('source')!='devglobal:public-api:'+market.upper() or not isinstance(data.get('items'),list):
                      raise ValueError('invalid upstream batch schema')
              except (HTTPError, URLError, TimeoutError, ValueError, KeyError, TypeError, json.JSONDecodeError) as exc:
                  # Absence is an explicit source outage; NEVER replace an old queue
                  # with empty data or call a 404 an exhausted hiring platform.
                  print('PUBLIC_DEVGLOBAL_UNAVAILABLE',market,type(exc).__name__,str(exc)[:140])
                  continue
              (target/f'devglobal-{market}-candidates.json').write_bytes(raw)
              print(market, 'published source roles',len(data['items']),'coverage',data.get('coverage'))
          PY
      - name: Validate actual source observations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for market in ('sg','my'):
              file=Path(f'artifacts/devglobal-{market}-candidates.json')
              if not file.is_file():
                  print('UNAVAILABLE_NOT_ZERO',market)
                  continue
              s=json.loads(file.read_text())
              assert s['source']=='devglobal:public-api:'+market.upper()
              assert len({item['url'] for item in s['items']})==len(s['items'])
              for item in s['items']:
                  assert item['market']==market.upper()
                  assert item['url'].startswith('https://devglobaljobs.com/jobs/detail/')
                  assert item['exact_jd_unverified'] is True
              print(market,'real title/location candidate IDs',len(s['items']),
                    'source coverage',s['coverage'],'failed pages',len(s['failed_pages']))
          PY
      - name: Publish real new source observations to existing machine queues
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for market in SG MY; do
              lower="${market,,}"
              if [[ -s "artifacts/devglobal-${lower}-candidates.json" ]]; then
                python scripts/platform_index_queue.py ingest \
                  --market "$market" --input "artifacts/devglobal-${lower}-candidates.json" \
                  --known discovery-state/known-role-index.json \
                  --state "discovery-state/platform-index-${lower}.json"
              else
                echo "PUBLIC_DEVGLOBAL_NOT_AVAILABLE $market; preserving existing queue"
              fi
            done
            python - <<'PY'
          import json
          from pathlib import Path
          for market in ('sg','my'):
              file=Path(f'artifacts/devglobal-{market}-candidates.json')
              if not file.is_file():
                  print('SOURCE_UNAVAILABLE_PRESERVED',market)
                  continue
              s=json.loads(Path(f'discovery-state/platform-index-{market}.json').read_text())
              feed=json.loads(file.read_text())
              queued={x['url'] for x in s['pending']+s['terminal']}
              assert all(r['url'] in queued for r in feed['items']),'a source candidate was lost'
              assert s['next_unacknowledged_seq']==min([r['seq'] for r in s['pending']],default=s['next_seq'])
              print('VERIFIED',market,'source items',len(feed['items']),'pending',len(s['pending']))
          PY
            git add discovery-state/platform-index-sg.json discovery-state/platform-index-my.json
            if git diff --cached --quiet; then
              echo 'All source IDs already accounted for; no changes.'
              exit 0
            fi
            git commit -m 'chore: ingest SG MY public feed source identities [skip ci]'
            if git push origin HEAD:main; then
              echo 'Persisted source records to canonical machine queue.'
              exit 0
            fi
            echo "Retrying concurrent write attempt ${attempt}/3"
          done
          echo 'Queue state push failed after optimistic retries'
          exit 1
      - name: Cite data source and report source health
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          lines=['# SG / MY Structured Feed Intake','',
            'Powered by Dev Global Jobs: https://devglobaljobs.com',
            'Public aggregator feed, NOT native JobStreet/LinkedIn or full market coverage.','',
            '| Market | Source IDs after title/location gate | Coverage | Failures |',
            '|---|---:|---|---:|']
          for market in ('sg','my'):
              f=Path(f'artifacts/devglobal-{market}-candidates.json')
              if f.exists():
                  s=json.loads(f.read_text())
                  lines.append(f"| {market.upper()} | {len(s['items'])} | {s['coverage']} | {len(s['failed_pages'])} |")
          lines+=['','No applicant actions. Roles require first-party JD, historical dedupe, seniority and source-route verification before Issue promotion.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-my-structured-feed
          path: artifacts/
          retention-days: 14
