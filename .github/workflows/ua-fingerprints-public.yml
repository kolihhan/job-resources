name: UA Fingerprints Public Repos

on:
  push:
    paths:
      - '.github/workflows/ua-fingerprints-public.yml'

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repos and pinned UA
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          mkdir -p work/repos
          git clone --depth 1 https://github.com/kolihhan/semantic-text2sql-agent.git work/repos/semantic-text2sql-agent
          git clone --depth 1 https://github.com/kolihhan/local-rag-search.git work/repos/local-rag-search
          git clone --depth 1 https://github.com/kolihhan/hermes-video-tutor.git work/repos/hermes-video-tutor
          git clone https://github.com/Egonex-AI/Understand-Anything.git work/Understand-Anything
          git -C work/Understand-Anything checkout 790b157028637b626c8666fa7fa28248944b900c

      - name: Build UA core
        run: |
          corepack enable
          corepack prepare pnpm@10.6.2 --activate
          cd work/Understand-Anything/understand-anything-plugin
          pnpm install --frozen-lockfile
          pnpm --filter @understand-anything/core build

      - name: Build official fingerprints from official scan inventory
        run: |
          set -euo pipefail
          UA_PLUGIN="$GITHUB_WORKSPACE/work/Understand-Anything/understand-anything-plugin"
          SKILL="$UA_PLUGIN/skills/understand"
          export NODE_PATH="$UA_PLUGIN/node_modules"
          mkdir -p out
          for name in semantic-text2sql-agent local-rag-search hermes-video-tutor; do
            root="$GITHUB_WORKSPACE/work/repos/$name"
            mkdir -p "$root/.ua/tmp" "$root/.ua/intermediate"
            node "$SKILL/scan-project.mjs" "$root" "$root/.ua/tmp/scan.json" --exclude-analysis-data
            python -c "import json,sys,pathlib; r=pathlib.Path(sys.argv[1]); s=json.loads((r/'.ua/tmp/scan.json').read_text()); h=sys.argv[2]; (r/'.ua/intermediate/fingerprint-input.json').write_text(json.dumps({'projectRoot':str(r),'filePaths':[x['path'] for x in s['files']],'gitCommitHash':h},indent=2))" "$root" "$(git -C "$root" rev-parse HEAD)"
            node "$SKILL/build-fingerprints.mjs" "$root/.ua/intermediate/fingerprint-input.json"
            mkdir -p "$GITHUB_WORKSPACE/out/$name"
            cp "$root/.ua/fingerprints.json" "$GITHUB_WORKSPACE/out/$name/fingerprints.json"
          done

      - name: Upload fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: ua-public-fingerprints
          path: out
          retention-days: 1
