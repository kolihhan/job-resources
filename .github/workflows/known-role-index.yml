name: Known Role Index

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/test_known_role_index.py'
      - 'tests/test_filter_freehire_coldstart.py'
      - 'tests/test_freehire_review_throughput.py'
      - 'scripts/build_known_role_index.py'
      - 'scripts/filter_freehire_coldstart.py'
      - 'scripts/build_freehire_review_queue.py'
      - '.github/workflows/known-role-index.yml'
  schedule:
    - cron: '52 * * * *'

permissions:
  contents: write
  issues: read

concurrency:
  group: known-role-index
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run derived-state tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build index from all GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_known_role_index.py

      - name: Download current FreeHire cold start
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/kolihhan/freehirefetch/main/feed/coldstart.json \
            -o /tmp/freehire-coldstart.json

      - name: Subtract known job history
        run: |
          python scripts/filter_freehire_coldstart.py \
            --coldstart /tmp/freehire-coldstart.json \
            --known discovery-state/known-role-index.json \
            --output discovery-state/freehire-coldstart.json

      - name: Write compact funnel summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('discovery-state/freehire-coldstart.json')
          data = json.loads(source.read_text(encoding='utf-8'))
          summary = {key: value for key, value in data.items() if key != 'candidates'}
          Path('discovery-state/freehire-coldstart-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Build bounded market review batches
        run: |
          python scripts/build_freehire_review_queue.py \
            --batch-size 200 \
            --shard-size 25 \
            --max-shard-bytes 8000

      - name: Publish derived discovery state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          snapshot="$(mktemp -d)"
          mkdir -p "$snapshot/state"
          cp discovery-state/known-role-index.json "$snapshot/state/"
          cp discovery-state/freehire-coldstart.json "$snapshot/state/"
          cp discovery-state/freehire-coldstart-summary.json "$snapshot/state/"
          cp discovery-state/freehire-review-registry.json "$snapshot/state/"
          cp discovery-state/freehire-batch-*.json "$snapshot/state/"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            rm -f discovery-state/freehire-batch-*.json
            cp "$snapshot/state/known-role-index.json" discovery-state/
            cp "$snapshot/state/freehire-coldstart.json" discovery-state/
            cp "$snapshot/state/freehire-coldstart-summary.json" discovery-state/
            cp "$snapshot/state/freehire-review-registry.json" discovery-state/
            cp "$snapshot/state"/freehire-batch-*.json discovery-state/

            git add -A discovery-state
            if git diff --cached --quiet; then
              echo "Derived discovery state unchanged."
              exit 0
            fi

            git commit -m "chore: refresh discovery dedupe state [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with main update; retrying from latest main (attempt $attempt/3)."
          done

          echo "Failed to publish derived discovery state after 3 attempts."
          exit 1
