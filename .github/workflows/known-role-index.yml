name: Known Role Index

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/test_known_role_index.py'
      - 'scripts/build_known_role_index.py'
      - '.github/workflows/known-role-index.yml'
  schedule:
    - cron: '52 * * * *'

permissions:
  contents: write
  issues: read

concurrency:
  group: known-role-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run known-role index tests
        run: python -m unittest tests/test_known_role_index.py -v

      - name: Build index from all GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_known_role_index.py

      - name: Publish derived index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery-state/known-role-index.json
          if git diff --cached --quiet; then
            echo "Known-role index unchanged."
            exit 0
          fi
          git commit -m "chore: refresh known-role index [skip ci]"
          git push
