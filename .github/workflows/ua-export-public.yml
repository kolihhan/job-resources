name: UA Public Source Bundle

on:
  push:
    paths:
      - '.github/workflows/ua-export-public.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout job-resources
        uses: actions/checkout@v4
        with:
          path: job-resources
          lfs: false

      - name: Clone public interview repos and pinned Understand Anything
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          mkdir -p bundle/repos
          git clone --depth 1 https://github.com/kolihhan/semantic-text2sql-agent.git bundle/repos/semantic-text2sql-agent
          git clone --depth 1 https://github.com/kolihhan/local-rag-search.git bundle/repos/local-rag-search
          git clone --depth 1 https://github.com/kolihhan/hermes-video-tutor.git bundle/repos/hermes-video-tutor
          git clone https://github.com/Egonex-AI/Understand-Anything.git bundle/Understand-Anything
          git -C bundle/Understand-Anything checkout 790b157028637b626c8666fa7fa28248944b900c
          mkdir -p bundle/job-resources
          cp job-resources/resumes/resume-en-current.md bundle/job-resources/resume-en-current.md
          find bundle/repos -type d -name .git -prune -exec rm -rf {} +
          rm -rf bundle/Understand-Anything/.git

      - name: Record source heads
        run: |
          for d in semantic-text2sql-agent local-rag-search hermes-video-tutor; do
            echo "$d $(git ls-remote https://github.com/kolihhan/$d.git HEAD | cut -f1)"
          done > bundle/source-heads.txt
          echo "Understand-Anything 790b157028637b626c8666fa7fa28248944b900c" >> bundle/source-heads.txt

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ua-public-source-bundle
          path: bundle
          include-hidden-files: true
          retention-days: 1
